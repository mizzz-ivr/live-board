name: Lift Project Tabs State

on:
  push:
    branches:
      - feat/project-tabs
    paths:
      - .github/workflows/lift-project-tabs-state.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/project-tabs
          fetch-depth: 0

      - name: Apply state lift
        run: python .github/scripts/lift-project-tabs-state.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Projectタブ状態をEditorセッションへ保持"
          git push origin HEAD:feat/project-tabs
