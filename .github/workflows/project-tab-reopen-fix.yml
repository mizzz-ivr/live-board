name: Project Tab Reopen Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/fix_project_tab_reopen.py
      - .github/workflows/project-tab-reopen-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.head_ref == 'feat/project-tab-persistence'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-tab-persistence
          fetch-depth: 0

      - name: Apply reopen fix
        run: python .github/scripts/fix_project_tab_reopen.py

      - name: Remove temporary files
        run: |
          rm .github/scripts/fix_project_tab_reopen.py
          rm .github/workflows/project-tab-reopen-fix.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "再読込後も閉じたProjectを復元可能にする"
          git push origin HEAD:feat/project-tab-persistence
