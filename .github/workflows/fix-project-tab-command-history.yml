name: Fix Project Tab Command History

on:
  push:
    branches:
      - feat/project-tabs
    paths:
      - .github/workflows/fix-project-tab-command-history.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/project-tabs
          fetch-depth: 0

      - name: Apply safe command history
        run: python .github/scripts/fix-project-tab-command-history.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Project操作履歴と孤立データ回収を修正"
          git push origin HEAD:feat/project-tabs
