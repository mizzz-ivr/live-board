name: Page Template Gallery Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'feat/page-template-gallery'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/page-template-gallery
          fetch-depth: 0

      - name: Apply page template integration
        run: python .github/scripts/apply-page-template-gallery-v2.py

      - name: Adjust template button accessibility label
        run: python .github/scripts/fix-page-template-button-label.py

      - name: Remove temporary implementation files
        run: |
          rm .github/scripts/apply-page-template-gallery.py
          rm .github/scripts/apply-page-template-gallery-v2.py
          rm .github/scripts/fix-page-template-button-label.py
          rm .github/workflows/page-template-gallery-apply.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pageテンプレートギャラリーを追加"
          git push origin HEAD:feat/page-template-gallery
