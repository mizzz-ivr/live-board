name: Project Tab Persistence Apply

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/scripts/apply_project_tab_persistence.py
      - .github/workflows/project-tab-persistence-apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'feat/project-tab-persistence'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-tab-persistence
          fetch-depth: 0

      - name: Apply Project tab persistence implementation
        run: |
          python .github/scripts/apply_project_tab_persistence.py
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/persistence/src/archive.ts')
          content = path.read_text(encoding='utf-8')
          old = '  editorState?: LiveboardEditorState;'
          if content.count(old) != 2:
              raise RuntimeError('editorState optional type target mismatch')
          path.write_text(
              content.replace(old, '  editorState?: LiveboardEditorState | undefined;'),
              encoding='utf-8',
          )
          PY

      - name: Remove temporary implementation files
        run: |
          rm .github/scripts/apply_project_tab_persistence.py
          rm .github/workflows/project-tab-persistence-apply.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Projectタブの表示状態を保存・復元"
          git push origin HEAD:feat/project-tab-persistence
