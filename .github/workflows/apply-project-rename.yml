name: Apply project rename implementation

on:
  push:
    branches:
      - feat/project-rename
    paths:
      - .github/workflows/apply-project-rename.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-rename
      - name: Apply implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise RuntimeError(f"replacement target not found: {path}\n{old[:160]}")
              file.write_text(text.replace(old, new, 1))

          def append_before_final(path: str, content: str) -> None:
              file = Path(path)
              text = file.read_text()
              marker = "\n});\n"
              index = text.rfind(marker)
              if index < 0:
                  raise RuntimeError(f"final describe marker not found: {path}")
              file.write_text(text[:index] + content + text[index:])

          # Domain operation
          replace_once(
              "packages/domain/src/workspace-projects.ts",
              "  cloneProject,\n  findProject,\n",
              "  cloneProject,\n  createProject,\n  findProject,\n  replaceProject,\n",
          )
          path = Path("packages/domain/src/workspace-projects.ts")
          text = path.read_text()
          text += """

          export function renameWorkspaceProject(
            workspace: Workspace,
            projectId: ProjectId,
            name: string,
            updatedAt = new Date().toISOString(),
          ): Workspace {
            const project = findProject(workspace, projectId);
            const normalizedName = name.trim();
            if (project.name === normalizedName) return workspace;

            const renamedProject = createProject({
              ...project,
              name: normalizedName,
              updatedAt,
            });
            return replaceProject(workspace, renamedProject, updatedAt);
          }
          """
          path.write_text(text)

          # Workspace Command
          replace_once(
              "packages/domain/src/workspace-commands.ts",
              "  appendWorkspaceProject,\n  selectWorkspaceProject,\n",
              "  appendWorkspaceProject,\n  renameWorkspaceProject,\n  selectWorkspaceProject,\n",
          )
          replace_once(
              "packages/domain/src/workspace-commands.ts",
              """export interface SelectProjectCommand extends WorkspaceCommandMetadata {
            type: 'workspace.project.select';
            workspaceId: WorkspaceId;
            projectId: ProjectId;
          }

          export type WorkspaceCommand = AddProjectCommand | SelectProjectCommand;
          """,
              """export interface SelectProjectCommand extends WorkspaceCommandMetadata {
            type: 'workspace.project.select';
            workspaceId: WorkspaceId;
            projectId: ProjectId;
          }

          export interface RenameProjectCommand extends WorkspaceCommandMetadata {
            type: 'workspace.project.rename';
            workspaceId: WorkspaceId;
            projectId: ProjectId;
            name: string;
          }

          export type WorkspaceCommand =
            | AddProjectCommand
            | SelectProjectCommand
            | RenameProjectCommand;
          """,
          )
          replace_once(
              "packages/domain/src/workspace-commands.ts",
              """export function applyWorkspaceCommand(
          """,
              """export function createRenameProjectCommand(
            workspaceId: WorkspaceId,
            projectId: ProjectId,
            name: string,
            metadata: WorkspaceCommandMetadata,
          ): RenameProjectCommand {
            return {
              type: 'workspace.project.rename',
              workspaceId,
              projectId,
              name,
              ...metadata,
            };
          }

          export function applyWorkspaceCommand(
          """,
          )
          replace_once(
              "packages/domain/src/workspace-commands.ts",
              """  const nextWorkspace = selectWorkspaceProject(
            workspace,
            command.projectId,
            command.createdAt,
          );
          return {
            workspace: nextWorkspace,
            changed: nextWorkspace !== workspace,
          };
          """,
              """  if (command.type === 'workspace.project.select') {
            const nextWorkspace = selectWorkspaceProject(
              workspace,
              command.projectId,
              command.createdAt,
            );
            return {
              workspace: nextWorkspace,
              changed: nextWorkspace !== workspace,
            };
          }

          const nextWorkspace = renameWorkspaceProject(
            workspace,
            command.projectId,
            command.name,
            command.createdAt,
          );
          return {
            workspace: nextWorkspace,
            changed: nextWorkspace !== workspace,
          };
          """,
          )

          # Workspace history
          replace_once(
              "packages/domain/src/history.ts",
              "  type AddProjectCommand,\n  type SelectProjectCommand,\n",
              "  type AddProjectCommand,\n  type RenameProjectCommand,\n  type SelectProjectCommand,\n",
          )
          replace_once(
              "packages/domain/src/history.ts",
              "  appendWorkspaceProject,\n  selectWorkspaceProject,\n",
              "  appendWorkspaceProject,\n  renameWorkspaceProject,\n  selectWorkspaceProject,\n",
          )
          replace_once(
              "packages/domain/src/history.ts",
              """export interface SelectProjectWorkspaceHistoryEntry
            extends WorkspaceHistoryEntryBase {
            command: SelectProjectCommand;
          }

          export type WorkspaceHistoryEntry =
            | AddProjectWorkspaceHistoryEntry
            | SelectProjectWorkspaceHistoryEntry;
          """,
              """export interface SelectProjectWorkspaceHistoryEntry
            extends WorkspaceHistoryEntryBase {
            command: SelectProjectCommand;
          }

          export interface RenameProjectWorkspaceHistoryEntry
            extends WorkspaceHistoryEntryBase {
            command: RenameProjectCommand;
            previousName: string;
          }

          export type WorkspaceHistoryEntry =
            | AddProjectWorkspaceHistoryEntry
            | SelectProjectWorkspaceHistoryEntry
            | RenameProjectWorkspaceHistoryEntry;
          """,
          )
          replace_once(
              "packages/domain/src/history.ts",
              """  const entry = createWorkspaceHistoryEntry(
            result.workspace,
            command,
            previousActiveProjectId,
          );
          """,
              """  const entry = createWorkspaceHistoryEntry(
            state.workspace,
            result.workspace,
            command,
            previousActiveProjectId,
          );
          """,
          )
          replace_once(
              "packages/domain/src/history.ts",
              """function createWorkspaceHistoryEntry(
            workspace: Workspace,
            command: WorkspaceCommand,
            previousActiveProjectId: ProjectId,
          ): WorkspaceHistoryEntry {
            if (command.type === 'workspace.project.add') {
              return withWorkspaceHistoryEstimate({
                historyId: `workspace-history:${command.commandId}`,
                command,
                previousActiveProjectId,
                projectSnapshot: cloneProject(findProject(workspace, command.project.id)),
              });
            }
            return withWorkspaceHistoryEstimate({
              historyId: `workspace-history:${command.commandId}`,
              command,
              previousActiveProjectId,
            });
          }
          """,
              """function createWorkspaceHistoryEntry(
            previousWorkspace: Workspace,
            workspace: Workspace,
            command: WorkspaceCommand,
            previousActiveProjectId: ProjectId,
          ): WorkspaceHistoryEntry {
            if (command.type === 'workspace.project.add') {
              return withWorkspaceHistoryEstimate({
                historyId: `workspace-history:${command.commandId}`,
                command,
                previousActiveProjectId,
                projectSnapshot: cloneProject(findProject(workspace, command.project.id)),
              });
            }
            if (command.type === 'workspace.project.rename') {
              return withWorkspaceHistoryEstimate({
                historyId: `workspace-history:${command.commandId}`,
                command,
                previousActiveProjectId,
                previousName: findProject(previousWorkspace, command.projectId).name,
              });
            }
            return withWorkspaceHistoryEstimate({
              historyId: `workspace-history:${command.commandId}`,
              command,
              previousActiveProjectId,
            });
          }
          """,
          )
          replace_once(
              "packages/domain/src/history.ts",
              """      }),
            };
          }
          return {
            workspace: selectWorkspaceProject(
              workspace,
              entry.previousActiveProjectId,
              updatedAt,
            ),
            futureEntry: entry,
          };
          """,
              """      }),
            };
          }
          if (isRenameProjectWorkspaceHistoryEntry(entry)) {
            return {
              workspace: renameWorkspaceProject(
                workspace,
                entry.command.projectId,
                entry.previousName,
                updatedAt,
              ),
              futureEntry: entry,
            };
          }
          return {
            workspace: selectWorkspaceProject(
              workspace,
              entry.previousActiveProjectId,
              updatedAt,
            ),
            futureEntry: entry,
          };
          """,
          )
          replace_once(
              "packages/domain/src/history.ts",
              """      }),
            };
          }
          return {
            workspace: selectWorkspaceProject(
              workspace,
              entry.command.projectId,
              updatedAt,
            ),
            pastEntry: withWorkspaceHistoryEstimate({
              ...entry,
              previousActiveProjectId,
            }),
          };
          """,
              """      }),
            };
          }
          if (isRenameProjectWorkspaceHistoryEntry(entry)) {
            return {
              workspace: renameWorkspaceProject(
                workspace,
                entry.command.projectId,
                entry.command.name,
                updatedAt,
              ),
              pastEntry: entry,
            };
          }
          return {
            workspace: selectWorkspaceProject(
              workspace,
              entry.command.projectId,
              updatedAt,
            ),
            pastEntry: withWorkspaceHistoryEstimate({
              ...entry,
              previousActiveProjectId,
            }),
          };
          """,
          )
          replace_once(
              "packages/domain/src/history.ts",
              """function removeAddedProject(
          """,
              """function isRenameProjectWorkspaceHistoryEntry(
            entry: WorkspaceHistoryEntry,
          ): entry is RenameProjectWorkspaceHistoryEntry {
            return entry.command.type === 'workspace.project.rename';
          }

          function removeAddedProject(
          """,
          )

          # Domain tests
          replace_once(
              "packages/domain/test/workspace-projects.test.ts",
              "  createWorkspace,\n  selectWorkspaceProject,\n",
              "  createWorkspace,\n  renameWorkspaceProject,\n  selectWorkspaceProject,\n",
          )
          append_before_final(
              "packages/domain/test/workspace-projects.test.ts",
              """

            it('Project名を前後空白を除去して変更する', () => {
              const current = workspace();
              const next = renameWorkspaceProject(current, 'project-1', '  配信用ボード  ', TIMESTAMP);

              expect(next).not.toBe(current);
              expect(next.projects[0]?.name).toBe('配信用ボード');
              expect(next.projects[0]?.id).toBe('project-1');
              expect(next.projects[0]?.pages).toEqual(current.projects[0]?.pages);
              expect(next.projects[1]).toBe(current.projects[1]);
              expect(next.activeProjectId).toBe(current.activeProjectId);
            });

            it('同じProject名への変更は同じWorkspaceを返す', () => {
              const current = workspace();
              expect(renameWorkspaceProject(current, 'project-1', ' project-1 ', TIMESTAMP)).toBe(current);
            });

            it('無効なProject名と存在しないProjectを拒否する', () => {
              expect(() => renameWorkspaceProject(workspace(), 'project-1', '   ', TIMESTAMP)).toThrow(
                'Entity name must be 1 to 120 characters',
              );
              expect(() =>
                renameWorkspaceProject(workspace(), 'project-1', 'a'.repeat(121), TIMESTAMP),
              ).toThrow('Entity name must be 1 to 120 characters');
              expect(() => renameWorkspaceProject(workspace(), 'missing', '名前', TIMESTAMP)).toThrow(
                'Project not found: missing',
              );
            });
          """,
          )
          replace_once(
              "packages/domain/test/workspace-command-history.test.ts",
              "  createProject,\n  createSelectProjectCommand,\n",
              "  createProject,\n  createRenameProjectCommand,\n  createSelectProjectCommand,\n",
          )
          append_before_final(
              "packages/domain/test/workspace-command-history.test.ts",
              """

            it('Project名変更をUndo・Redoできる', () => {
              const renamed = dispatchWorkspaceCommand(
                createWorkspaceCommandState(workspace()),
                createRenameProjectCommand('workspace-1', 'project-1', '配信用ボード', {
                  commandId: 'command-rename',
                  createdAt: TIMESTAMP,
                }),
              );

              expect(findProject(renamed.workspace, 'project-1').name).toBe('配信用ボード');
              expect(findProject(undoWorkspaceCommand(renamed).workspace, 'project-1').name).toBe(
                'project-1',
              );
              expect(
                findProject(
                  redoWorkspaceCommand(undoWorkspaceCommand(renamed)).workspace,
                  'project-1',
                ).name,
              ).toBe('配信用ボード');
            });

            it('同じProject名への変更は履歴を追加しない', () => {
              const state = createWorkspaceCommandState(workspace());
              const next = dispatchWorkspaceCommand(
                state,
                createRenameProjectCommand('workspace-1', 'project-1', 'project-1', {
                  commandId: 'command-rename-noop',
                  createdAt: TIMESTAMP,
                }),
              );
              expect(next).toBe(state);
              expect(canUndoWorkspace(next)).toBe(false);
            });
          """,
          )

          # Desktop UI
          replace_once(
              "apps/desktop/src/ProjectTabs.tsx",
              "  onCreate(): void;\n  onUndoProjectOperation(): void;\n",
              "  onCreate(): void;\n  onRename(projectId: string, name: string): void;\n  onUndoProjectOperation(): void;\n",
          )
          replace_once(
              "apps/desktop/src/ProjectTabs.tsx",
              "  onCreate,\n  onUndoProjectOperation,\n",
              "  onCreate,\n  onRename,\n  onUndoProjectOperation,\n",
          )
          replace_once(
              "apps/desktop/src/ProjectTabs.tsx",
              """  function togglePin(projectId: string): void {
            onTabsChange((current) => toggleProjectTabPin(current, projectId));
            focusTab(projectId);
          }

          """,
              """  function togglePin(projectId: string): void {
            onTabsChange((current) => toggleProjectTabPin(current, projectId));
            focusTab(projectId);
          }

            function rename(project: Project): void {
              const requestedName = window.prompt(
                'Project名を入力してください（1〜120文字）',
                project.name,
              );
              if (requestedName === null) return;

              const normalizedName = requestedName.trim();
              if (normalizedName.length < 1 || normalizedName.length > 120) {
                window.alert('Project名は1〜120文字で入力してください');
                return;
              }
              onRename(project.id, normalizedName);
            }

          """,
          )
          replace_once(
              "apps/desktop/src/ProjectTabs.tsx",
              """              <button
                type="button"
                className="project-tab-pin"
          """,
              """              <button
                type="button"
                className="project-tab-rename"
                aria-label={`${project.name}の名前を変更`}
                onClick={() => rename(project)}
              >
                名前
              </button>
              <button
                type="button"
                className="project-tab-pin"
          """,
          )

          replace_once(
              "apps/desktop/src/project-tabs.css",
              ".project-tabs-shell .project-tab-select,\n.project-tabs-shell .project-tab-pin,\n",
              ".project-tabs-shell .project-tab-select,\n.project-tabs-shell .project-tab-rename,\n.project-tabs-shell .project-tab-pin,\n",
          )
          replace_once(
              "apps/desktop/src/project-tabs.css",
              ".project-tabs-shell .project-tab-pin,\n.project-tabs-shell .project-tab-close {\n",
              ".project-tabs-shell .project-tab-rename,\n.project-tabs-shell .project-tab-pin,\n.project-tabs-shell .project-tab-close {\n",
          )
          replace_once(
              "apps/desktop/src/project-tabs.css",
              ".project-tabs-shell .project-tab-pin {\n  font-size: 9px;\n}\n",
              ".project-tabs-shell .project-tab-rename,\n.project-tabs-shell .project-tab-pin {\n  font-size: 9px;\n}\n",
          )
          replace_once(
              "apps/desktop/src/project-tabs.css",
              ".project-tabs-shell .project-tab-pin:hover,\n",
              ".project-tabs-shell .project-tab-rename:hover,\n.project-tabs-shell .project-tab-pin:hover,\n",
          )

          replace_once(
              "apps/desktop/src/AppV2.tsx",
              "  createProject,\n  createProjectAssetLibrary,\n",
              "  createProject,\n  createProjectAssetLibrary,\n  createRenameProjectCommand,\n",
          )
          replace_once(
              "apps/desktop/src/AppV2.tsx",
              """  function undoProjectOperation(): void {
          """,
              """  function renameProject(projectId: string, name: string): void {
            try {
              setCommandState((current) =>
                dispatchWorkspaceCommandWithCanvasHistory(
                  current,
                  createRenameProjectCommand(
                    current.workspace.id,
                    projectId,
                    name,
                    createCommandMetadata('project-rename'),
                  ),
                ),
              );
              setDomainError(null);
            } catch (error: unknown) {
              setDomainError(
                error instanceof DomainError ? error.message : 'Project名の変更に失敗しました',
              );
            }
          }

          function undoProjectOperation(): void {
          """,
          )
          replace_once(
              "apps/desktop/src/AppV2.tsx",
              "          onCreate={createProjectTab}\n          onUndoProjectOperation={undoProjectOperation}\n",
              "          onCreate={createProjectTab}\n          onRename={renameProject}\n          onUndoProjectOperation={undoProjectOperation}\n",
          )

          # E2E
          path = Path("tests/e2e/project-tabs-desktop.spec.ts")
          text = path.read_text()
          text += """

          test('Project名を変更し、Project操作でUndo・Redoできる', async ({ page }) => {
            await page.goto('/');
            await expect(page.getByTestId('canvas-surface')).toBeVisible();

            const tablist = page.getByRole('tablist', { name: 'プロジェクト' });
            const originalTab = tablist.getByRole('tab', { name: /新しいプロジェクト/ });
            await expect(originalTab).toHaveAttribute('aria-selected', 'true');

            page.once('dialog', async (dialog) => dialog.accept('  配信用ボード  '));
            await page.getByRole('button', { name: '新しいプロジェクトの名前を変更' }).click();

            const renamedTab = tablist.getByRole('tab', { name: /配信用ボード/ });
            await expect(renamedTab).toHaveAttribute('aria-selected', 'true');
            await expect(page.getByText('ワークスペースに未保存の変更あり')).toBeVisible();

            await page.getByRole('button', { name: 'Project操作を元に戻す' }).click();
            await expect(tablist.getByRole('tab', { name: /新しいプロジェクト/ })).toBeVisible();

            await page.getByRole('button', { name: 'Project操作をやり直す' }).click();
            await expect(renamedTab).toBeVisible();
            await expect(renamedTab).toHaveAttribute('aria-selected', 'true');
          });
          """
          path.write_text(text)

          # Documentation
          replace_once(
              "docs/project-tabs.md",
              "- `workspace.project.select`: 既存Projectを選択\n",
              "- `workspace.project.select`: 既存Projectを選択\n- `workspace.project.rename`: Project名を変更\n",
          )
          replace_once(
              "docs/project-tabs.md",
              "Project選択履歴は操作前後のProject IDだけを保持します。選択変更も保存対象・OBS送信先を変更するDomain操作としてUndo / Redoできます。\n",
              "Project選択履歴は操作前後のProject IDだけを保持します。選択変更も保存対象・OBS送信先を変更するDomain操作としてUndo / Redoできます。\n\nProject名変更履歴は変更前の名前とCommand上の変更後の名前を保持します。Undo / RedoではProject ID、Page、Layer、Asset、配信設定を変更せず、名前と更新日時だけを切り替えます。\n",
          )
          replace_once(
              "docs/project-tabs.md",
              "- `＋`: 初期Pageを持つProjectを追加して選択\n",
              "- `＋`: 初期Pageを持つProjectを追加して選択\n- `名前`: 1〜120文字のProject名へ変更\n",
          )
          replace_once(
              "docs/project-tabs.md",
              "- Project選択をUndo / Redoできる\n",
              "- Project選択をUndo / Redoできる\n- Project名変更をUndo / Redoできる\n- 無効なProject名をDomain境界で拒否する\n",
          )
          replace_once(
              "docs/project-tabs.md",
              "- Project本体の削除、名前変更、複製\n",
              "- Project本体の削除、複製\n",
          )
          replace_once(
              "README.md",
              "- Project追加、タブ切り替え、タブを閉じる、直近タブの復元、Workspace単位の未保存表示\n",
              "- Project追加、名前変更、タブ切り替え、タブを閉じる、直近タブの復元、Workspace単位の未保存表示\n",
          )
          replace_once(
              "README.md",
              "- 初期Page付きProjectを追加\n",
              "- 初期Page付きProjectを追加\n- Project名を変更し、Project操作としてUndo / Redo\n",
          )

          Path('.github/workflows/apply-project-rename.yml').unlink()
          PY
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Project名変更とUndo・Redoを追加"
          git push origin HEAD:feat/project-rename
