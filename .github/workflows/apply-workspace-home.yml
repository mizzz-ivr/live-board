name: Apply workspace home

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-workspace-home.yml'
      - 'scripts/apply-workspace-home.mjs'
      - 'apps/desktop/src/WorkspaceHome.tsx'
      - 'apps/desktop/src/workspace-home.css'
      - 'apps/desktop/src/workspace-home-model.ts'

permissions:
  contents: write

concurrency:
  group: apply-workspace-home-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workspace-home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Escape generated template literal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-workspace-home.mjs')
          source = path.read_text(encoding='utf-8')
          source = source.replace('${actionLabel}', r'\${actionLabel}')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Apply workspace home changes
        id: apply
        shell: bash
        run: |
          set +e
          node scripts/apply-workspace-home.mjs > apply-workspace-home-error.txt 2>&1
          status=$?
          set -e
          cat apply-workspace-home-error.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Record diagnostic failure
        if: steps.apply.outputs.status != '0'
        run: |
          git restore apps playwright.config.ts scripts/apply-workspace-home.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apply-workspace-home-error.txt
          git commit -m "ワークスペースホーム接続の診断ログを更新"
          git push origin HEAD:feat/workspace-home
          exit 1
      - name: Remove temporary files
        if: steps.apply.outputs.status == '0'
        run: |
          rm .github/workflows/apply-workspace-home.yml
          rm scripts/apply-workspace-home.mjs
          rm apply-workspace-home-error.txt
      - name: Commit changes
        if: steps.apply.outputs.status == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ワークスペースホームを既存Editorへ接続"
          git push origin HEAD:feat/workspace-home
