name: Project Command Palette Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'feat/project-command-palette'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/project-command-palette
          fetch-depth: 0

      - name: Apply command palette implementation
        run: python .github/scripts/apply-project-command-palette.py

      - name: Fix command palette search test
        run: python .github/scripts/fix-project-command-palette-test.py

      - name: Remove temporary implementation files
        run: |
          rm .github/scripts/apply-project-command-palette.py
          rm .github/scripts/fix-project-command-palette-test.py
          rm .github/workflows/project-command-palette-apply.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Project操作を検索実行できるコマンドパレットを追加"
          git push origin HEAD:feat/project-command-palette
