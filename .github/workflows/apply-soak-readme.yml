name: Apply soak README update

on:
  push:
    branches:
      - feat/windows-package-soak-test
    paths:
      - '.github/workflows/apply-soak-readme.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/windows-package-soak-test

      - name: Update README
        shell: python
        run: |
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'M3「保存・復旧・性能・配信操作性」に加え、画像Asset分離配信、Renderer–Main／OBS OverlayのLayer差分転送、Windows向け未署名RCパッケージ生成まで実装しています。':
              'M3「保存・復旧・性能・配信操作性」に加え、画像Asset分離配信、Renderer–Main／OBS OverlayのLayer差分転送、Windows向け未署名RCパッケージ生成と100回反復soakまで実装しています。',
              '- パッケージ済みexeによる永続化・loopback Bridge・Overlay HTTP smoke test\n- Windows成果物のSHA-256一覧とソースhead SHA付きmanifest':
              '- パッケージ済みexeによる永続化・loopback Bridge・Overlay HTTP smoke test\n- パッケージ済みMainの100回反復soakとRSS／反復時間診断\n- soak診断JSONのsource head SHA付きartifact保存\n- Windows成果物のSHA-256一覧とソースhead SHA付きmanifest',
              '- GitHub ActionsではSHA-256一覧と`package-manifest.json`を同梱したartifactを14日保持\n- コード署名は未対応のため、SmartScreenやウイルス対策ソフトの警告が表示される可能性があります':
              '- GitHub ActionsではSHA-256一覧と`package-manifest.json`を同梱したartifactを14日保持\n- 同じWindows Package CIで100回soakを実行し、診断JSONを別artifactとして14日保持\n- コード署名は未対応のため、SmartScreenやウイルス対策ソフトの警告が表示される可能性があります',
              'パッケージ済みexeは内部smoke testで、Renderer／Overlayの配置、永続化初期化、loopback OBS Bridge、token付きOverlay HTTP 200を確認します。詳細は[Windows配布パッケージ設計](docs/windows-packaging.md)を参照してください。':
              'パッケージ済みexeは内部smoke testで、Renderer／Overlayの配置、永続化初期化、loopback OBS Bridge、token付きOverlay HTTP 200を確認します。`--smoke-iterations=100`では同じライフサイクルを反復し、所要時間とRSSを集計します。詳細は[Windows配布パッケージ設計](docs/windows-packaging.md)と[Windowsパッケージ反復soak test設計](docs/windows-package-soak.md)を参照してください。',
              '- 28,800回の8時間相当切り替えはrevision欠番0件、保持Workspace 1件でした。\n- これらはUbuntu / Node.js / Vitest上の状態遷移計測で、Windows Electron・OBS・GPUの実機値ではありません。':
              '- 28,800回の8時間相当切り替えはrevision欠番0件、保持Workspace 1件でした。\n- Windows packaged soakは100 / 100回成功、p95 63.163ms、最大200.460ms、RSS増加17.62MiBでした。\n- 状態遷移値はUbuntu / Node.js / Vitest、packaged soakはWindows Server 2025 runner上の値で、実OBS・GPU・利用者端末の実測値ではありません。',
              '- Windows Package CIのpackaged smoke testは永続化とloopback Overlay経路を確認しますが、実OBS、GPU、スリープ復帰、長時間操作の代替ではありません。':
              '- Windows Package CIは1回smokeと100回soakで永続化・loopback Overlay経路・Main RSS推移を確認しますが、実OBS、GPU、スリープ復帰、8時間操作の代替ではありません。',
              'Windows Package CIはパッケージ済みElectron Main、永続化初期化、loopback Bridge、Overlay HTTP取得を自動確認します。実OBS Browser Source、GPU、スリープ復帰、8時間連続試験は後続で実施します。':
              'Windows Package CIはパッケージ済みElectron Main、永続化初期化、loopback Bridge、Overlay HTTP取得を1回smokeと100回soakで確認し、RSSと反復時間を診断artifactへ保存します。実OBS Browser Source、GPU、スリープ復帰、8時間連続試験は後続で実施します。',
              '- [Windows配布パッケージ](docs/windows-packaging.md)\n- [ロードマップ](docs/roadmap.md)':
              '- [Windows配布パッケージ](docs/windows-packaging.md)\n- [Windowsパッケージ反復soak test](docs/windows-package-soak.md)\n- [ロードマップ](docs/roadmap.md)',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one README match, found {count}: {old[:80]}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Commit update and remove workflow
        shell: bash
        run: |
          rm .github/workflows/apply-soak-readme.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .github/workflows/apply-soak-readme.yml
          git commit -m 'READMEへWindows packaged soakを追加'
          git push origin HEAD:feat/windows-package-soak-test
