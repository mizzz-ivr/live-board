name: Develop CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

concurrency:
  group: develop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply project rename implementation
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/project-rename'
        shell: bash
        run: |
          sed -n "/python <<'PY'/,/^          PY$/p" .github/workflows/apply-project-rename.yml \
            | sed '1d;$d;s/^          //' > /tmp/apply-project-rename.py
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/apply-project-rename.py')
          text = path.read_text()
          text = text.replace('from pathlib import Path\n', 'from pathlib import Path\nimport re\n', 1)
          helper = '''def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old in text:
                  file.write_text(text.replace(old, new, 1))
                  return
              tokens = re.split(r'(\\s+)', old)
              pattern = ''.join(
                  r'\\s+' if token.isspace() else re.escape(token)
                  for token in tokens
                  if token
              )
              match = re.search(pattern, text)
              if match is None:
                  raise RuntimeError(f"replacement target not found: {path}\\n{old[:160]}")
              file.write_text(text[:match.start()] + new + text[match.end():])'''
          text, count = re.subn(
              r'def replace_once\(.*?\n\ndef append_before_final',
              lambda _: helper + '\n\ndef append_before_final',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise RuntimeError('replace_once helper patch failed')
          path.write_text(text)
          PY
          python /tmp/apply-project-rename.py
          python <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/project-tabs-desktop.spec.ts')
          text = path.read_text()
          text = text.replace(
              "await firstTab.dragTo(secondTab, { targetPosition: { x: 2, y: 10 } });",
              "await firstTab.dragTo(secondTab.locator('..'), { targetPosition: { x: 2, y: 10 } });",
          )
          text = text.replace(
              "await secondTab.dragTo(thirdTab, { targetPosition: { x: 2, y: 10 } });",
              "await secondTab.dragTo(thirdTab.locator('..'), { targetPosition: { x: 2, y: 10 } });",
          )
          path.write_text(text)
          PY
          git show origin/main:.github/workflows/develop.yml > .github/workflows/develop.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/package.json', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Commit applied implementation
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/project-rename'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Project名変更とUndo・Redoを追加"
          git push origin HEAD:${{ github.head_ref }}
