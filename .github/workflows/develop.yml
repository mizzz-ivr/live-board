name: Develop CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

concurrency:
  group: develop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Rebuild minimal project rename diff
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/project-rename'
        shell: bash
        run: |
          git checkout origin/main -- \
            packages/domain/src/history.ts \
            packages/domain/src/workspace-commands.ts \
            packages/domain/src/workspace-projects.ts \
            apps/desktop/src/AppV2.tsx \
            apps/desktop/src/ProjectTabs.tsx
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise RuntimeError(f'replacement target not found: {path}\n{old[:160]}')
              file.write_text(text.replace(old, new, 1))

          # Workspace project operation
          replace_once(
              'packages/domain/src/workspace-projects.ts',
              "  cloneProject,\n  findProject,\n",
              "  cloneProject,\n  createProject,\n  findProject,\n  replaceProject,\n",
          )
          project_ops = Path('packages/domain/src/workspace-projects.ts')
          project_ops.write_text(
              project_ops.read_text()
              + """

export function renameWorkspaceProject(
  workspace: Workspace,
  projectId: ProjectId,
  name: string,
  updatedAt = new Date().toISOString(),
): Workspace {
  const project = findProject(workspace, projectId);
  const normalizedName = name.trim();
  if (project.name === normalizedName) return workspace;

  const renamedProject = createProject({
    ...project,
    name: normalizedName,
    updatedAt,
  });
  return replaceProject(workspace, renamedProject, updatedAt);
}
"""
          )

          # Workspace command file is small enough to define explicitly.
          Path('packages/domain/src/workspace-commands.ts').write_text("""import {
  DomainError,
  cloneProject,
  type Project,
  type ProjectId,
  type Workspace,
  type WorkspaceId,
} from './model.js';
import {
  appendWorkspaceProject,
  renameWorkspaceProject,
  selectWorkspaceProject,
} from './workspace-projects.js';

export interface WorkspaceCommandMetadata {
  commandId: string;
  createdAt: string;
}

export interface AddProjectCommand extends WorkspaceCommandMetadata {
  type: 'workspace.project.add';
  workspaceId: WorkspaceId;
  project: Project;
}

export interface SelectProjectCommand extends WorkspaceCommandMetadata {
  type: 'workspace.project.select';
  workspaceId: WorkspaceId;
  projectId: ProjectId;
}

export interface RenameProjectCommand extends WorkspaceCommandMetadata {
  type: 'workspace.project.rename';
  workspaceId: WorkspaceId;
  projectId: ProjectId;
  name: string;
}

export type WorkspaceCommand =
  | AddProjectCommand
  | SelectProjectCommand
  | RenameProjectCommand;

export interface WorkspaceCommandResult {
  workspace: Workspace;
  changed: boolean;
}

export function createAddProjectCommand(
  workspaceId: WorkspaceId,
  project: Project,
  metadata: WorkspaceCommandMetadata,
): AddProjectCommand {
  return {
    type: 'workspace.project.add',
    workspaceId,
    project: cloneProject(project),
    ...metadata,
  };
}

export function createSelectProjectCommand(
  workspaceId: WorkspaceId,
  projectId: ProjectId,
  metadata: WorkspaceCommandMetadata,
): SelectProjectCommand {
  return {
    type: 'workspace.project.select',
    workspaceId,
    projectId,
    ...metadata,
  };
}

export function createRenameProjectCommand(
  workspaceId: WorkspaceId,
  projectId: ProjectId,
  name: string,
  metadata: WorkspaceCommandMetadata,
): RenameProjectCommand {
  return {
    type: 'workspace.project.rename',
    workspaceId,
    projectId,
    name,
    ...metadata,
  };
}

export function applyWorkspaceCommand(
  workspace: Workspace,
  command: WorkspaceCommand,
): WorkspaceCommandResult {
  if (workspace.id !== command.workspaceId) {
    throw new DomainError(
      'WORKSPACE_NOT_FOUND',
      `Workspace not found: ${command.workspaceId}`,
    );
  }

  if (command.type === 'workspace.project.add') {
    return {
      workspace: appendWorkspaceProject(workspace, command.project, command.createdAt),
      changed: true,
    };
  }

  if (command.type === 'workspace.project.select') {
    const nextWorkspace = selectWorkspaceProject(
      workspace,
      command.projectId,
      command.createdAt,
    );
    return {
      workspace: nextWorkspace,
      changed: nextWorkspace !== workspace,
    };
  }

  const nextWorkspace = renameWorkspaceProject(
    workspace,
    command.projectId,
    command.name,
    command.createdAt,
  );
  return {
    workspace: nextWorkspace,
    changed: nextWorkspace !== workspace,
  };
}
""")

