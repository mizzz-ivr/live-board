name: Apply workspace idle status

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/apply-workspace-idle-status.yml'
      - 'scripts/apply-workspace-idle-status.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/workspace-home
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply idle status integration
        run: node scripts/apply-workspace-idle-status.mjs
      - name: Remove temporary files
        run: |
          rm .github/workflows/apply-workspace-idle-status.yml
          rm scripts/apply-workspace-idle-status.mjs
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "ファイル選択キャンセル時に保存状態ラベルを復元"
          git push origin HEAD:feat/workspace-home
