name: Fix Workspace History Narrowing

on:
  push:
    branches:
      - feat/project-tabs
    paths:
      - .github/workflows/fix-workspace-history-narrowing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/project-tabs
          fetch-depth: 0

      - name: Apply type narrowing fix
        run: python .github/scripts/fix-workspace-history-narrowing.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Workspace履歴の型絞り込みを修正"
          git push origin HEAD:feat/project-tabs
