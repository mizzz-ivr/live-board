name: User Page Template Asset Commit Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'feat/user-page-template-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/user-page-template-assets
          fetch-depth: 0

      - name: Apply state commit fix
        run: python .github/scripts/fix-user-page-template-asset-commit.py

      - name: Remove temporary implementation files
        run: |
          rm .github/scripts/fix-user-page-template-asset-commit.py
          rm .github/workflows/user-page-template-asset-commit-fix.yml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e

      - name: Commit verified state fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Asset付きテンプレートの状態確定を事前検証済みスナップショットへ統一"
          git push origin HEAD:feat/user-page-template-assets
